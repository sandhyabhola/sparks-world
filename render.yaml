services:
  - type: web
    name: sparks-world
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - {key: PYTHON_VERSION, value: "3.12.3"}
      - {key: DATABASE_URL, sync: false}
      - {key: EMAIL_SECRET, sync: false}
      - {key: GROQ_API_KEY, sync: false}
      - {key: GEMINI_API_KEY, sync: false}
      - {key: CF_ACCOUNT_ID, sync: false}
      - {key: CF_API_TOKEN, sync: false}
      - {key: TURNSTILE_SITE_KEY, sync: false}
      - {key: TURNSTILE_SECRET, sync: false}
      - {key: GOOGLE_CLIENT_ID, sync: false}
      - {key: BREVO_API_KEY, sync: false}
      - {key: MAIL_FROM_EMAIL, sync: false}
